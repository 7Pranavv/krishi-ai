<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plant Disease Detection — Krishi.AI</title>
  <link rel="icon" href="/assets/icon.svg" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip_to_content">Skip to content</a>

  <main class="page" id="main">
    <div class="page-head">
      <h1><span aria-hidden="true">🍃</span> <span data-i18n="disease_heading">Plant Disease Detection</span></h1>
      <p data-i18n="disease_intro">Take a clear photo of a single affected leaf against a plain background,
         then upload it here.</p>
    </div>

    <div id="availability"></div>

    <div class="grid grid-2">
      <section class="card">
        <div class="card-title"><h2 style="margin:0" data-i18n="disease_upload">Upload a leaf photo</h2></div>

        <div class="dropzone" id="dropzone" role="button" tabindex="0"
             data-i18n-label="disease_choose_aria" aria-label="Choose a leaf photo or drop one here">
          <span class="dropzone-icon" aria-hidden="true">📷</span>
          <strong data-i18n="disease_choose">Tap to choose a photo</strong>
          <span class="hint" data-i18n="disease_drag_hint">or drag one here · JPG, PNG or WEBP · up to 8 MB</span>
        </div>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" class="sr-only" />

        <div id="preview" hidden style="margin-top:16px">
          <img class="preview-image" id="preview-img" data-i18n-title="disease_preview_alt" alt="The leaf photo you selected" />
          <p class="hint" id="preview-name" style="text-align:center;margin-top:8px"></p>
        </div>

        <div id="file-error" class="field-error" role="alert" style="margin-top:8px"></div>

        <div class="field" style="margin-top:16px">
          <label for="language" data-i18n="disease_explain_in">Explain the result in</label>
          <select id="language">
            <option value="English">English</option>
            <option value="Hindi">हिंदी (Hindi)</option>
            <option value="Bengali">বাংলা (Bengali)</option>
            <option value="Marathi">मराठी (Marathi)</option>
            <option value="Telugu">తెలుగు (Telugu)</option>
            <option value="Tamil">தமிழ் (Tamil)</option>
            <option value="Gujarati">ગુજરાતી (Gujarati)</option>
            <option value="Kannada">ಕನ್ನಡ (Kannada)</option>
            <option value="Malayalam">മലയാളം (Malayalam)</option>
            <option value="Punjabi">ਪੰਜਾਬੀ (Punjabi)</option>
            <option value="Odia">ଓଡ଼ିଆ (Odia)</option>
            <option value="Assamese">অসমীয়া (Assamese)</option>
            <option value="Urdu">اردو (Urdu)</option>
          </select>
        </div>

        <div class="row">
          <button class="btn" id="analyse" type="button" disabled data-i18n="disease_analyse">Analyse photo</button>
          <button class="btn btn-secondary" id="clear" type="button" hidden data-i18n="common_clear">Clear</button>
        </div>
      </section>

      <div id="result"></div>
    </div>
  </main>

  <script type="module">
    import { api, ensureSession } from '/js/api.js';
    import { renderShell, withBusy, showError, showEmpty, escapeHtml, formatReply , t } from '/js/ui.js';
    import { mountChatWidget } from '/js/widget.js';

    await renderShell('disease');
    mountChatWidget();

    const MAX_BYTES = 8 * 1024 * 1024;
    const ALLOWED = ['image/jpeg', 'image/png', 'image/webp'];

    const dropzone = document.getElementById('dropzone');
    const input = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('preview-img');
    const previewName = document.getElementById('preview-name');
    const fileError = document.getElementById('file-error');
    const analyse = document.getElementById('analyse');
    const clearBtn = document.getElementById('clear');
    const result = document.getElementById('result');

    let selected = null;
    let objectUrl = null;

    showEmpty(result, t('disease_empty_title'),
      t('disease_empty_body'), '🔬');

    // Tell the farmer up front if the model is not loaded, instead of letting
    // them upload a photo and hit an error.
    (async () => {
      try {
        const health = await api.health();
        const disease = health.ml?.models?.disease;
        if (disease && !disease.ready) {
          document.getElementById('availability').innerHTML = `
            <div class="alert alert-warning" role="alert" style="margin-bottom:24px">
              <span aria-hidden="true">⏳</span>
              <div>
                <strong data-i18n="disease_unavailable_title">Disease detection is not available on this server yet.</strong>
                <span data-i18n="disease_unavailable_body">The trained image model has not been installed. Everything else in
                      Krishi.AI works normally.</span>
              </div>
            </div>`;
          analyse.title = 'The disease model is not installed on this server.';
        }
      } catch {
        /* Health is advisory only - the upload flow reports its own errors. */
      }
    })();

    function clearFile() {
      selected = null;
      if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
      input.value = '';
      preview.hidden = true;
      clearBtn.hidden = true;
      analyse.disabled = true;
      fileError.textContent = '';
    }

    function selectFile(file) {
      fileError.textContent = '';
      if (!file) return;
      if (!ALLOWED.includes(file.type)) {
        clearFile();
        fileError.textContent = t('disease_bad_type');
        return;
      }
      if (file.size > MAX_BYTES) {
        clearFile();
        fileError.textContent = t('disease_too_big');
        return;
      }
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      selected = file;
      objectUrl = URL.createObjectURL(file);
      previewImg.src = objectUrl;
      previewName.textContent = `${file.name} · ${(file.size / 1024).toFixed(0)} KB`;
      preview.hidden = false;
      clearBtn.hidden = false;
      analyse.disabled = false;
    }

    dropzone.addEventListener('click', () => input.click());
    dropzone.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); input.click(); }
    });
    ['dragenter', 'dragover'].forEach((type) =>
      dropzone.addEventListener(type, (e) => { e.preventDefault(); dropzone.classList.add('is-over'); }));
    ['dragleave', 'drop'].forEach((type) =>
      dropzone.addEventListener(type, () => dropzone.classList.remove('is-over')));
    dropzone.addEventListener('drop', (event) => {
      event.preventDefault();
      selectFile(event.dataTransfer.files?.[0]);
    });
    input.addEventListener('change', () => selectFile(input.files?.[0]));
    clearBtn.addEventListener('click', () => {
      clearFile();
      showEmpty(result, t('disease_empty_title'),
        t('disease_empty_body'), '🔬');
    });

    function render(data) {
      const healthy = data.healthy;
      const others = (data.top_predictions || []).slice(1);
      result.innerHTML = `
        ${data.low_confidence ? `<div class="alert alert-warning" role="alert" style="margin-bottom:16px">
          <span aria-hidden="true">⚠️</span>
          <div><strong data-i18n="disease_uncertain_title">This result is uncertain.</strong>
          <span data-i18n="disease_uncertain_body">Try a sharper, closer photo of one leaf in daylight, or ask an
                agriculture officer before treating the crop.</span></div></div>` : ''}

        <div class="result-card" ${healthy ? '' : 'style="background:linear-gradient(135deg,#5a2317,#8a3a24)"'}>
          <div class="result-label">${escapeHtml(data.crop)}</div>
          <div class="result-value">${escapeHtml(data.condition)}</div>
          <div class="metric-row">
            <div class="metric-box">
              <div class="metric-val">${(data.confidence * 100).toFixed(1)}%</div>
              <div class="metric-lbl" data-i18n="crop_confidence">Confidence</div>
            </div>
            <div class="metric-box">
              <div class="metric-val" style="font-size:1rem">${healthy ? t('disease_healthy') : t('disease_needs_attention')}</div>
              <div class="metric-lbl" data-i18n="home_status_state">Status</div>
            </div>
          </div>
        </div>

        ${data.heatmap ? `<section class="card" style="margin-top:16px">
            <div class="card-title"><h3 style="margin:0" data-i18n="disease_heatmap_title">What the model looked at</h3></div>
            <img class="preview-image" src="${data.heatmap}"
                 alt="${escapeHtml(t('disease_heatmap_alt'))}" />
            <p class="hint" style="margin-top:12px" data-i18n="disease_heatmap_hint">Red areas influenced the result most,
               blue least. If the red sits on the background or a shadow rather than the
               leaf, treat the result with caution and try another photo.</p>
          </section>` : ''}

        ${others.length ? `<section class="card" style="margin-top:16px">
          <div class="card-title"><h3 style="margin:0" data-i18n="disease_other">Other possibilities</h3></div>
          ${others.map((c) => `<div class="bar-row">
            <div class="bar-head"><span>${escapeHtml(c.crop)} — ${escapeHtml(c.condition)}</span>
              <span>${(c.probability * 100).toFixed(1)}%</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.min(c.probability * 100, 100).toFixed(1)}%"></div></div>
          </div>`).join('')}
        </section>` : ''}

        ${data.guidance ? `<section class="card" style="margin-top:16px">
            <div class="card-title"><h3 style="margin:0" data-i18n="disease_what_to_do">What to do</h3>
              <span class="pill pill-info" data-i18n="common_ai_generated">AI generated</span></div>
            <div class="guidance">${formatReply(data.guidance)}</div>
            <p class="hint" style="margin-top:12px" data-i18n="disease_label_warning">Always follow the product label and your
               state's pesticide rules. Confirm with an agriculture officer before spraying.</p>
          </section>`
          : (healthy ? '' : `<div class="alert alert-info" style="margin-top:16px">
              <span aria-hidden="true">ℹ️</span>
              <div><strong data-i18n="disease_no_guidance_title">Treatment guidance is not available right now.</strong>
              <span>The detection above still stands. You can ask the assistant about
                    ${escapeHtml(data.condition)} on ${escapeHtml(data.crop)}.</span></div></div>`)}`;
    }

    analyse.addEventListener('click', () => {
      if (!selected) return;
      const body = new FormData();
      body.append('file', selected);
      body.append('language', document.getElementById('language').value);
      body.append('explain', 'true');

      withBusy(analyse, t('disease_analysing'), async () => {
        result.innerHTML = `<div class="card"><div class="state">
          <div class="spinner"></div><p data-i18n="disease_working">Looking at your photo. This can take a few seconds.</p>
        </div></div>`;
        try {
          await ensureSession();
          render(await api.predictDisease(body));
        } catch (error) {
          showError(result, error);
        }
      });
    });
  </script>
</body>
</html>
